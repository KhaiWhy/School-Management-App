# Render Blueprint: the app as a free static site (always on).
# Render → New → Blueprint → pick this repo. Full steps (and the optional Node web service): DEPLOY.md.
services:
  - type: web
    name: school-management-app
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Single-page app: every path loads index.html and React Router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Render asks for these on first deploy (Supabase → Project Settings → API Keys).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
