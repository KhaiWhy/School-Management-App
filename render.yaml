# Render Blueprint: deploys the app as a free static site.
# Render → New → Blueprint → pick this repo. Or create a Static Site by hand
# with the same build command, publish path and rewrite rule.
services:
  - type: web
    name: school-management-app
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Single-page app: every path loads index.html and React Router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
