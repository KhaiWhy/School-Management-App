# Render Blueprint: Node web service (serves the app + username sign-in).
# Render → New → Blueprint → pick this repo. Full steps and the static-site option: DEPLOY.md.
services:
  - type: web
    name: school-management-app
    runtime: node
    plan: free # change to starter so it doesn't sleep
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render asks for these on first deploy; values come from Supabase → Project Settings → API.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
